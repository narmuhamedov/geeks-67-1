<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        .logo span {
            color: #3498db;
        }
        .nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            padding: 5px 0;
        }
        .nav a:hover {
            color: #3498db;
        }
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            .nav {
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">My<span>Site</span></a>
                <nav class="nav">
                    <a href="#">Главная</a>
                    <a href="#">О нас</a>
                    <a href="#">Услуги</a>
                    <a href="#">Контакты</a>
                </nav>
            </div>
        </div>
    </header>
    <main style="flex: 1; padding: 40px 0;">
        <div class="container">
            <h1>Основной контент</h1>
            <p>Здесь будет содержимое вашей страницы.</p>
        </div>
    </main>
